# One place to change how the whole Frontier series is wired. Nothing in here is a secret.

[series]
name = "Frontier"
domain = "frontier.solas33.com"       # every site lives under this one host, as a path: /quantum/, /coin/, ...
contact_email = "hello@solas33.com"   # corrections, SEC fair-access contact, photo requests
alt_email = "dmcdtkofc@outlook.com"
publisher = "Solas33"
indexable = true                      # true lets search engines in (switched on 15 Oct 2026 after the founder's read and legal clearance)
cf_worker_name = "frontier"

